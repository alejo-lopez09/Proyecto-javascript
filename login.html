Campos:

email
contraseña -->

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Iniciar sesión | Hotel El Rincón del Carmen
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="CSS/estilacos.css">
    <link rel="stylesheet" href="CSS/admin.css">
    <link rel="stylesheet" href="CSS/reservas.css">
    <link rel="stylesheet" href="CSS/responsive.css">

</head>

<body>

    <!-- =========================================
            NAVBAR
    ========================================== -->

    <header class="navbar">

        <div class="container navbar-container flex-between">

            <a href="./index.html">

                <h3>
                    El Rincón del Carmen
                </h3>

            </a>

            <nav>

                <ul class="nav-links">

                    <li>
                        <a href="./index.html">
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a href="./reservas.html">
                            Reservas
                        </a>
                    </li>

                    <li>
                        <a href="./contacto.html">
                            Contacto
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <!-- =========================================
            HERO
    ========================================== -->

    <section class="booking-hero">

        <div class="container">

            <div class="booking-hero-content fade-up">

                <span class="badge mb-1">
                    Acceso de huéspedes
                </span>

                <h1 class="mb-2">
                    Inicia sesión en tu cuenta
                </h1>

                <p class="mb-3">
                    Accede para consultar, gestionar o cancelar tus reservas de manera rápida y segura.
                </p>

            </div>

        </div>

    </section>

    <!-- =========================================
            FORMULARIO LOGIN
    ========================================== -->

    <section class="booking-section">

        <div class="container-sm">

            <div class="booking-card glass">

                <div class="section-title mb-3">

                    <h2 class="mb-1">
                        Bienvenido nuevamente
                    </h2>

                    <p>
                        Ingresa tus datos para continuar.
                    </p>

                </div>

                <form
                    id="loginForm"
                    class="booking-form"
                >

                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="input"
                            placeholder="correo@email.com"
                            required
                        >

                    </div>

                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="input"
                            placeholder="••••••••"
                            required
                        >

                    </div>

                    <!-- BOTÓN -->

                    <button
                        type="submit"
                        class="btn btn-primary search-btn"
                    >
                        Iniciar sesión
                    </button>

                </form>

                <!-- LINK REGISTRO -->

                <div class="register-link mt-2">

                    <p>
                        ¿No tienes una cuenta?
                        <a href="./registro.html">
                            Regístrate aquí
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </section>

    <!-- SCRIPT -->

    <script src="./js/login.js"></script>

</body>

</html>
